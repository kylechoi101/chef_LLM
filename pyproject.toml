[project]
name = "chef-llm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasketch>=2.0.0",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "recipe-scrapers>=15.12.0",
    "requests>=2.34.2",
